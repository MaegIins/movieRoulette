<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visites — Movie Roulette</title>
    <link rel="icon" type="image/png" href="/icon/mr512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg: #f4f1ea;
        --color-ink: #17140f;
        --color-muted: #6b665c;
        --color-accent: #a3272a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: 'Inter', 'Helvetica Neue', sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      p.eyebrow {
        margin: 0;
        color: var(--color-muted);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-size: 0.7rem;
      }
      .count {
        font-family: 'Fraunces', 'Georgia', serif;
        font-weight: 600;
        font-size: clamp(3rem, 12vw, 6rem);
        line-height: 1;
      }
      p.label {
        margin: 0;
        color: var(--color-muted);
      }
      a {
        margin-top: 1rem;
        color: var(--color-accent);
        text-decoration: none;
        font-size: 0.8rem;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Movie Roulette</p>
    <p class="count" id="count">—</p>
    <p class="label">visites depuis le lancement</p>
    <a href="/">← Retour à l'app</a>
    <script>
      fetch('/api/visits')
        .then((res) => res.json())
        .then((data) => {
          document.getElementById('count').textContent = data.count.toLocaleString('fr-FR')
        })
        .catch(() => {
          document.getElementById('count').textContent = '?'
        })
    </script>
  </body>
</html>
